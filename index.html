
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>超軽量ミニバスアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-sans select-none">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white px-4 py-3 shadow flex items-center justify-between">
    <h1 class="font-black text-sm tracking-tight">🏀 葉梨ミニバス スコア＆管理</h1>
    <button onclick="resetGame()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-2.5 py-1 rounded-lg font-bold">リセット</button>
  </header>

  <!-- タブナビゲーション -->
  <nav class="bg-white border-b border-slate-200 grid grid-cols-3 text-center text-xs font-black shadow-xs">
    <button onclick="switchTab('roster')" id="tab-btn-roster" class="py-3 text-indigo-600 border-b-2 border-indigo-600">1. メンバー</button>
    <button onclick="switchTab('match')" id="tab-btn-match" class="py-3 text-slate-500 border-b-2 border-transparent">2. 試合入力</button>
    <button onclick="switchTab('sheet')" id="tab-btn-sheet" class="py-3 text-slate-500 border-b-2 border-transparent">3. シート</button>
  </nav>

  <!-- メインコンテンツ -->
  <main class="flex-1 p-3 max-w-md w-full mx-auto space-y-3 pb-16">

    <!-- TAB 1: メンバー管理 -->
    <section id="section-roster" class="space-y-3">
      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-xs font-extrabold text-slate-700 mb-2">👥 チーム切り替え</h2>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setTeam('hanari')" id="team-btn-hanari" class="py-2 rounded-xl text-xs font-black bg-indigo-600 text-white">葉梨ミニバス</button>
          <button onclick="setTeam('hatsukura')" id="team-btn-hatsukura" class="py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-700">初倉ミニバス</button>
        </div>
      </div>

      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-xs font-extrabold text-slate-700 mb-2">➕ 選手追加</h2>
        <div class="grid grid-cols-3 gap-2 mb-2">
          <select id="new-grade" class="border rounded-xl px-2 py-2 text-xs font-bold bg-white">
            <option value="6">6年</option><option value="5">5年</option><option value="4">4年</option><option value="3">3年</option><option value="2">2年</option><option value="1">1年</option>
          </select>
          <input id="new-number" type="number" placeholder="背番号" class="border rounded-xl px-2 py-2 text-xs font-bold text-center" />
          <input id="new-name" type="text" placeholder="選手氏名" class="border rounded-xl px-2 py-2 text-xs font-bold" />
        </div>
        <button onclick="addPlayer()" class="w-full bg-indigo-600 text-white font-black text-xs py-2 rounded-xl shadow">選手を追加</button>
      </div>

      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200">
        <h2 class="text-xs font-extrabold text-slate-700 mb-2">📋 <span id="current-team-name">葉梨</span> 選手一覧（<span id="player-count">0</span>名）</h2>
        <div id="player-list" class="space-y-1.5 max-h-[40vh] overflow-y-auto"></div>
      </div>
    </section>

    <!-- TAB 2: 試合入力 -->
    <section id="section-match" class="hidden space-y-3">
      <!-- スコアボード -->
      <div class="bg-slate-900 text-white p-3 rounded-2xl shadow text-center">
        <div class="text-[11px] font-bold text-slate-400">総得点</div>
        <div id="match-score" class="text-4xl font-black tracking-tight">0</div>
        <div class="text-[10px] text-amber-400 font-bold mt-0.5">⚡ 背番号タップで即【+2点】</div>
      </div>

      <!-- 出場メンバー（横並びタイル 5人） -->
      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-extrabold text-slate-700">コート上の5人（タップで得点）</h2>
          <button onclick="openSubModal()" class="text-[11px] bg-indigo-50 text-indigo-600 font-black px-2 py-1 rounded-lg border border-indigo-200">選手交代</button>
        </div>
        <div id="court-list" class="grid grid-cols-5 gap-1.5"></div>
      </div>

      <!-- 得点履歴 -->
      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200">
        <div class="flex justify-between items-center mb-1.5">
          <h2 class="text-xs font-extrabold text-slate-700">直近の得点履歴</h2>
          <button onclick="undoScore()" class="text-[10px] bg-rose-50 text-rose-600 font-bold px-2 py-0.5 rounded border border-rose-200">直近取消</button>
        </div>
        <div id="score-history" class="text-xs text-slate-500 space-y-1 max-h-20 overflow-y-auto"></div>
      </div>
    </section>

    <!-- TAB 3: シート表示 -->
    <section id="section-sheet" class="hidden space-y-3">
      <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-xs font-black text-slate-900">葉梨ミニバス 公式スコア集計</h2>
          <button onclick="window.print()" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl">印刷</button>
        </div>
        <div class="text-xs space-y-1 text-slate-700">
          <div><b>総得点：</b> <span id="sheet-total-score" class="text-lg font-black text-indigo-600">0</span>点</div>
        </div>
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 border-b font-bold text-slate-600">
              <th class="p-2 w-10 text-center">学年</th>
              <th class="p-2 w-12 text-center">No.</th>
              <th class="p-2">選手氏名</th>
              <th class="p-2 text-right">得点</th>
            </tr>
          </thead>
          <tbody id="sheet-tbody" class="divide-y divide-slate-100 font-medium"></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- 交代モーダル -->
  <div id="sub-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-3 shadow-xl">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-black text-slate-800">選手交代（コートインする選手を選択）</h3>
        <button onclick="closeSubModal()" class="text-slate-400 font-bold px-2 py-1">✕</button>
      </div>
      <div id="sub-bench-list" class="space-y-1.5 max-h-[50vh] overflow-y-auto"></div>
    </div>
  </div>

  <script>
    let db = {
      activeTeam: "hanari",
      teams: {
        hanari: {
          name: "葉梨ミニバス",
          players: [
            { id: "h1", grade: "6", number: "1", name: "竹下 花梨" },
            { id: "h2", grade: "6", number: "2", name: "行川 結愛" },
            { id: "h3", grade: "6", number: "3", name: "行川 乃愛" },
            { id: "h4", grade: "6", number: "4", name: "加藤 凛" },
            { id: "h5", grade: "6", number: "5", name: "虎岩 朋奈" },
            { id: "h6", grade: "5", number: "6", name: "杉山 愛奈" },
            { id: "h7", grade: "5", number: "7", name: "富永 朝陽" },
            { id: "h8", grade: "5", number: "8", name: "嘉納 心奈" },
            { id: "h9", grade: "5", number: "9", name: "伊東 澪" }
          ],
          courtIds: ["h1", "h2", "h3", "h4", "h5"]
        },
        hatsukura: {
          name: "初倉ミニバス",
          players: [
            { id: "t1", grade: "6", number: "1", name: "太田 葵" },
            { id: "t2", grade: "6", number: "2", name: "翼 結香" },
            { id: "t3", grade: "6", number: "3", name: "山村 亮太郎" },
            { id: "t4", grade: "6", number: "4", name: "堀本 悠矢" },
            { id: "t5", grade: "5", number: "5", name: "翼 天佑" },
            { id: "t6", grade: "5", number: "6", name: "甲賀 虎之介" },
            { id: "t7", grade: "5", number: "7", name: "大石 岳" }
          ],
          courtIds: ["t1", "t2", "t3", "t4", "t5"]
        }
      },
      scores: [] // { team: 'hanari', number, name, points: 2 }
    };

    let subTargetIndex = 0;

    function save() {
      localStorage.setItem("light_minibas_db", JSON.stringify(db));
    }
    function load() {
      const d = localStorage.getItem("light_minibas_db");
      if (d) { try { db = JSON.parse(d); } catch(e){} }
    }

    function switchTab(tab) {
      ["roster", "match", "sheet"].forEach(t => {
        document.getElementById(`section-${t}`).classList.add("hidden");
        document.getElementById(`tab-btn-${t}`).className = "py-3 text-slate-500 border-b-2 border-transparent font-black";
      });
      document.getElementById(`section-${tab}`).classList.remove("hidden");
      document.getElementById(`tab-btn-${tab}`).className = "py-3 text-indigo-600 border-b-2 border-indigo-600 font-black";
      if (tab === "match") renderMatch();
      if (tab === "sheet") renderSheet();
    }

    function setTeam(teamKey) {
      db.activeTeam = teamKey;
      document.getElementById("team-btn-hanari").className = teamKey === 'hanari' ? "py-2 rounded-xl text-xs font-black bg-indigo-600 text-white" : "py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-700";
      document.getElementById("team-btn-hatsukura").className = teamKey === 'hatsukura' ? "py-2 rounded-xl text-xs font-black bg-indigo-600 text-white" : "py-2 rounded-xl text-xs font-black bg-slate-100 text-slate-700";
      renderRoster();
    }

    function renderAll() {
      renderRoster();
      renderMatch();
      renderSheet();
    }

    function renderRoster() {
      const team = db.teams[db.activeTeam];
      document.getElementById("current-team-name").textContent = team.name;
      document.getElementById("player-count").textContent = team.players.length;
      const list = document.getElementById("player-list");
      list.innerHTML = "";
      team.players.forEach(p => {
        const div = document.createElement("div");
        div.className = "flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100 text-xs font-bold";
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">${p.grade}年</span>
            <span class="text-sm font-black text-indigo-800 w-6">#${p.number}</span>
            <span>${escapeHtml(p.name)}</span>
          </div>
          <button onclick="deletePlayer('${p.id}')" class="text-rose-500 font-bold px-2 py-1">削除</button>
        `;
        list.appendChild(div);
      });
    }

    function addPlayer() {
      const grade = document.getElementById("new-grade").value;
      const number = document.getElementById("new-number").value.trim();
      const name = document.getElementById("new-name").value.trim();
      if (!number || !name) { alert("背番号と氏名を入力してください"); return; }
      const team = db.teams[db.activeTeam];
      const newId = db.activeTeam[0] + "_" + Date.now();
      team.players.push({ id: newId, grade, number, name });
      if (team.courtIds.length < 5) team.courtIds.push(newId);
      document.getElementById("new-number").value = "";
      document.getElementById("new-name").value = "";
      save(); renderAll();
    }

    function deletePlayer(id) {
      const team = db.teams[db.activeTeam];
      team.players = team.players.filter(p => p.id !== id);
      team.courtIds = team.courtIds.filter(cid => cid !== id);
      save(); renderAll();
    }

    function renderMatch() {
      const team = db.teams[db.activeTeam];
      const courtContainer = document.getElementById("court-list");
      courtContainer.innerHTML = "";

      for (let i = 0; i < 5; i++) {
        const playerId = team.courtIds[i];
        const player = team.players.find(p => p.id === playerId);
        const btn = document.createElement("button");
        btn.className = "bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl p-1.5 text-center active:scale-95 transition flex flex-col justify-between h-20";
        if (player) {
          btn.onclick = () => addScore(player);
          btn.innerHTML = `
            <div class="text-xs font-black text-indigo-800">#${player.number}</div>
            <div class="text-[9px] font-bold text-slate-600 truncate">${escapeHtml(player.name)}</div>
            <div class="bg-indigo-600 text-white text-[10px] font-black py-0.5 rounded">+2点</div>
          `;
        } else {
          btn.onclick = () => { subTargetIndex = i; openSubModal(); };
          btn.innerHTML = `<div class="text-[10px] text-slate-400 font-bold m-auto">+ 選択</div>`;
        }
        courtContainer.appendChild(btn);
      }

      // 総得点
      const total = db.scores.reduce((sum, s) => sum + s.points, 0);
      document.getElementById("match-score").textContent = total;

      // 履歴
      const historyEl = document.getElementById("score-history");
      historyEl.innerHTML = "";
      if (db.scores.length === 0) {
        historyEl.innerHTML = `<span class="text-slate-400">得点履歴なし</span>`;
      } else {
        [...db.scores].reverse().slice(0, 5).forEach(s => {
          const div = document.createElement("div");
          div.className = "flex justify-between items-center bg-slate-50 px-2 py-1 rounded text-xs";
          div.innerHTML = `<span>#${s.number} ${escapeHtml(s.name)}</span><span class="font-black text-indigo-600">+${s.points}点</span>`;
          historyEl.appendChild(div);
        });
      }
    }

    function addScore(player) {
      db.scores.push({ number: player.number, name: player.name, points: 2 });
      save(); renderMatch();
    }

    function undoScore() {
      if (db.scores.length === 0) return;
      db.scores.pop();
      save(); renderMatch();
    }
function openSubModal() {
      const team = db.teams[db.activeTeam];
      const modalList = document.getElementById("sub-bench-list");
      modalList.innerHTML = "";
      team.players.forEach(p => {
        const isPlaying = team.courtIds.includes(p.id);
        const div = document.createElement("div");
        div.className = "flex items-center justify-between p-2 rounded-xl bg-slate-50 border text-xs font-bold";
        div.innerHTML = `
          <div>#${p.number} ${escapeHtml(p.name)} ${isPlaying ? '<span class="text-indigo-600 text-[10px]">(コート中)</span>' : ''}</div>
          <button onclick="substitutePlayer('${p.id}')" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg text-xs">起用</button>
        `;
        modalList.appendChild(div);
      });
      document.getElementById("sub-modal").classList.remove("hidden");
    }

    function closeSubModal() {
      document.getElementById("sub-modal").classList.add("hidden");
    }

    function substitutePlayer(playerId) {
      const team = db.teams[db.activeTeam];
      team.courtIds[subTargetIndex] = playerId;
      closeSubModal();
      save(); renderMatch();
    }

    function renderSheet() {
      const hanariTeam = db.teams.hanari;
      const total = db.scores.reduce((sum, s) => sum + s.points, 0);
      document.getElementById("sheet-total-score").textContent = total;

      const ptsMap = {};
      db.scores.forEach(s => { ptsMap[s.number] = (ptsMap[s.number] || 0) + s.points; });

      const tbody = document.getElementById("sheet-tbody");
      tbody.innerHTML = "";
      hanariTeam.players.forEach(p => {
        const tr = document.createElement("tr");
        tr.className = "border-b border-slate-100";
        tr.innerHTML = `
          <td class="p-2 text-center font-bold text-slate-500">${p.grade}年</td>
          <td class="p-2 text-center font-black">#${p.number}</td>
          <td class="p-2 font-bold">${escapeHtml(p.name)}</td>
          <td class="p-2 text-right font-black text-indigo-600">${ptsMap[p.number] || 0}点</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function resetGame() {
      if (confirm("得点をリセットしますか？")) {
        db.scores = [];
        save(); renderAll();
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    load();
    renderAll();
  </script>
</body>
</html>
